services:
  # Umbrel's gateway service: Umbrel reads APP_HOST/APP_PORT from here
  # and routes the app's Open button to the dashboard. It is removed
  # from the runtime compose by Umbrel itself (never a sidecar).
  # PROXY_AUTH_ADD is false because the dashboard has its own login.
  app_proxy:
    environment:
      APP_HOST: jcreates-mc-dashboard_mc-dashboard_1
      APP_PORT: 8000
      PROXY_AUTH_ADD: "false"

  mc-dashboard:
    # Git build context on purpose: Umbrel only copies a whitelist of files
    # (docker-compose.yml, umbrel-app.yml, exports.sh, hooks) from the app
    # store repo into the app folder, so a Dockerfile and the dashboard
    # source never reach the box. Plain `build: .` therefore always failed
    # with "failed to read dockerfile: no such file or directory". Pointing
    # the build at the public repo instead lets Docker's BuildKit fetch the
    # Dockerfile and source itself at install time — the compose file IS
    # copied by Umbrel, and it carries this URL with it. This also avoids
    # needing a published image at all (the GHCR workflow route was blocked:
    # the GitHub App cannot push .github/workflows files, 403).
    build:
      context: https://github.com/JoeFiore/jcreates-app-store.git#main:jcreates-mc-dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # The dashboard itself is NOT published here on purpose: Umbrel
      # reaches it through app_proxy above, so it can't collide with
      # a host port. Open the app from Umbrel, not via a direct port.
      # Minecraft itself: join on <umbrel>:25565 (LAN, or Tailscale
      # address:25565 away from home). RCON (25575) is intentionally
      # not published — the dashboard runs the server itself.
      - "25565:25565"
    volumes:
      - "${APP_DATA_DIR}:/data"
    environment:
      SERVER_DIR: /data/server
      JAR_FILE: server.jar
      JAVA_ARGS: -Xmx6G -Xms1G
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-changeme}
      MODS_ENABLED: "false"
      PORT: 8000
