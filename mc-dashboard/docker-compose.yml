services:
  mc-dashboard:
    build: .
    restart: unless-stopped
    ports:
      # Umbrel assigns the dashboard's host port (${APP_PORT}); the
      # container always listens on 8000. Open the app from Umbrel and
      # it lands on the dashboard.
      - "${APP_PORT}:8000"
      # Minecraft itself: join on <umbrel>:25565 (LAN, or Tailscale
      # address:25565 away from home). RCON (25575) is intentionally
      # not published — the dashboard runs the server itself.
      - "25565:25565"
    volumes:
      - "${APP_DATA_DIR}:/data"
    environment:
      SERVER_DIR: /data/server
      JAR_FILE: server.jar
      JAVA_ARGS: -Xmx4G -Xms1G
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-changeme}
      MODS_ENABLED: "false"
      PORT: 8000
